function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++){m[i]=[i]}for(j=0;j<=b.length;j++){m[0][j]=j}
for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function find(p,input){var n=norm(input);if(n.length<2)return -1;var i,keys;
for(i=0;i<p.a.length;i++){keys=[p.a[i][0]].concat(p.a[i][2].split("|")).map(norm);if(keys.indexOf(n)>-1)return i}
return -1}
function suggest(p,input){var n=norm(input);if(n.length<3)return -1;var best=-1,bd=9,i,k,keys,d,al;
for(i=0;i<p.a.length;i++){keys=[p.a[i][0]].concat(p.a[i][2].split("|")).map(norm);
for(k=0;k<keys.length;k++){if(keys[k].length<4)continue;al=Math.min(3,Math.max(1,Math.floor(keys[k].length*.3)));d=lev(n,keys[k]);if(d<=al&&d<bd){bd=d;best=i}}}
return best}

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function intro(){app.innerHTML='<h1>Top Shelf</h1><p class="muted">'+(S.practice?"Unlimited mode: random questions, as many rounds as you like. Your daily result stays as it is.":"Daily set for "+DAY+". Everyone gets the same questions today. The next set arrives at midnight local time.")+'</p><p class="q" style="font-weight:400">Seven hockey questions. Common answers barely score. The answers few people think of go top shelf.</p>'+
'<p class="muted">You get '+TIME+' seconds per question. A correct answer scores by how rare it is. Wrong answers and repeats score nothing. Rarity starts from estimates and shifts toward real player answers as more people play.</p><button id="go">Drop the puck</button>'+UNLBTN()+ACCT();
document.getElementById("go").onclick=ask;var u=document.getElementById("unl");if(u)u.onclick=openUnlimited;bindAcct()}
function ask(){var p=Q[S.i],left=TIME,t0=Date.now();
app.innerHTML=rinkHTML()+'<div class="rank"><span>Question '+(S.i+1)+' of '+Q.length+'</span></div><div class="bar"><b id="tb"></b></div><div class="q">'+esc(p.q)+'</div>'+
'<input id="in" autocomplete="off" autocapitalize="words" enterkeyhint="go" placeholder="Type your answer" aria-label="Your answer"><p class="muted" id="note" role="status">Up to '+TRIES+' tries.</p><button id="ok">Submit answer</button>';
var inp=document.getElementById("in");inp.focus();
var tries=0,note=document.getElementById("note");
function done(timedOut){clearInterval(timer);grade(timedOut?"":inp.value,timedOut)}
function miss(v){tries++;if(tries>=TRIES){done(false);return}var n=TRIES-tries;note.textContent="No match for \u201c"+v.trim()+"\u201d. "+n+(n===1?" try":" tries")+" left.";inp.value="";inp.focus()}
function submit(){var v=inp.value;if(!v.trim()){inp.focus();return}
if(find(p,v)>=0){done(false);return}
var sg=suggest(p,v);if(sg<0){miss(v);return}
var nm=p.a[sg][0];note.textContent="Did you mean "+nm+"? ";
var y=document.createElement("button"),no=document.createElement("button");
y.textContent="Yes, submit "+nm;no.textContent="No, try again";no.className="alt";
note.appendChild(y);note.appendChild(no);
y.onclick=function(){clearInterval(timer);grade(nm,false)};
no.onclick=function(){miss(v)}}
document.getElementById("ok").onclick=submit;
inp.onkeydown=function(e){if(e.key==="Enter")submit()};
timer=setInterval(function(){left=TIME-(Date.now()-t0)/1000;document.getElementById("tb").style.width=Math.max(0,left/TIME*100)+"%";if(left<=0)done(true)},100)}
async function grade(text,timedOut){if(S.busy)return;S.busy=1;var p=Q[S.i],idx=find(p,text),r={},html;
if(idx<0||S.used[S.i+":"+idx]){r.t=-1;r.pts=0;if(idx<0)await live(p,"",0);
html='<div class="tier">'+(timedOut?"Time’s up":idx<0?"No score":"Already used")+'</div><p>'+(timedOut?"You ran out of time.":idx<0?(text.trim()?"We couldn’t match “"+esc(text.trim())+"” to a valid answer.":"You left it blank."):"You already gave that answer.")+'</p>'}
else{S.used[S.i+":"+idx]=1;var a=p.a[idx],sh=await live(p,a[0],a[1]),t=tierFor(sh.v);r.t=t;r.pts=PTS[t];
html='<div class="tier t'+t+'">'+NAMES[t]+' · +'+r.pts+'</div><p><b>'+esc(a[0])+'</b> was picked by about '+sh.v+'% of '+sh.src+'.</p>'}
S.total+=r.pts;S.res.push(r);
var best=p.a.slice().sort(function(x,y){return x[1]-y[1]}).slice(0,3).map(function(x){return x[0]}).join(", ");
app.innerHTML=rinkHTML()+'<div class="q">'+esc(p.q)+'</div><div class="res">'+html+'<p class="muted">Rarest answers on the board: '+esc(best)+'.</p></div>'+
'<button id="nx">'+(S.i<Q.length-1?"Next question":"See final score")+'</button>';
S.busy=0;document.getElementById("nx").focus();
document.getElementById("nx").onclick=function(){S.i++;S.i<Q.length?ask():finish()}}
function finish(){save();renderFinal()}
function renderFinal(){var sq=S.res.map(function(r){return r.t<0?"⬜":["🟦","🟦","🟦","🟦","🟥"][r.t]===undefined?"⬜":(r.t===4?"🟥":r.t>=2?"🟦":"⬜")}).join("");
var txt="Top Shelf "+(S.practice?"unlimited":DAY)+": "+S.total+" pts, "+rankFor(S.total)+"\n"+sq;
app.innerHTML=rinkHTML()+'<h2>'+esc(rankFor(S.total))+'</h2><p class="muted">'+S.total+' of a possible '+MAX+' points.</p><div class="log" aria-hidden="true">'+
S.res.map(function(r){return '<span class="t'+(r.t<0?0:r.t)+'"></span>'}).join("")+'</div><pre id="sh">'+esc(txt)+'</pre>'+
'<button id="cp">Copy result</button><button class="alt" id="again">'+(S.practice?"Another round":UNL?"Unlimited mode":"Unlimited mode · $5")+'</button>'+ACCT();
document.getElementById("cp").onclick=function(){var b=this;try{navigator.clipboard.writeText(txt).then(function(){b.textContent="Copied"},function(){b.textContent="Select the text above to copy"})}catch(e){b.textContent="Select the text above to copy"}};
document.getElementById("again").onclick=function(){S.practice?start(true):openUnlimited()};bindAcct()}
async function init(){if(sb){try{var r=await sb.rpc("server_day");if(r.data)DAY=r.data}catch(e){}
await authInit();await chkUnl();var back=/[?&]unlocked=1/.test(location.search);
if(back&&!UNL){for(var k=0;k<6&&!UNL;k++){await new Promise(function(r2){setTimeout(r2,2000)});await chkUnl()}}
if(back){try{history.replaceState(null,"",location.pathname)}catch(e){}}}
start()}
init();
</script>
</body>
</html>
